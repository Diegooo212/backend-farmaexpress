# Perfil "h2": base en memoria compatible con MySQL. Sirve para los tests y para
# levantar el servicio sin tener MySQL instalado (los datos se pierden al detenerlo).
spring.datasource.url=jdbc:h2:mem:prescriptions;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
