spring.application.name=farmaexpress-payments
server.port=${PORT:8084}

# --- MySQL (base propia de este microservicio) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/farmaexpress_payments?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# El esquema lo crea Flyway (src/main/resources/db/migration); Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- URLs del flujo de pago ---
# A dónde vuelve el navegador del cliente desde el proveedor (ruta pública del BFF; se le agrega /webpay, /khipu...).
farmaexpress.pagos.url-retorno=${PAGOS_URL_RETORNO:http://localhost:8080/api/bff/payments/retorno}
# Frontend: página de resultado y simulador.
farmaexpress.pagos.url-frontend=${FRONTEND_URL:http://localhost:5173}
farmaexpress.pagos.timeout-conexion=3s
farmaexpress.pagos.timeout-respuesta=8s

# --- Webpay Plus (Transbank) --- sin código de comercio ni llave = simulador.
farmaexpress.pagos.webpay.url=${WEBPAY_URL:https://webpay3gint.transbank.cl}
farmaexpress.pagos.webpay.codigo-comercio=${WEBPAY_CODIGO_COMERCIO:}
farmaexpress.pagos.webpay.api-key=${WEBPAY_API_KEY:}

# --- Mercado Pago (Checkout Pro) --- sin token = simulador. Token de prueba: TEST-...
farmaexpress.pagos.mercadopago.url=${MERCADOPAGO_URL:https://api.mercadopago.com}
farmaexpress.pagos.mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}

# --- Khipu (API v3) --- sin llave = simulador.
farmaexpress.pagos.khipu.url=${KHIPU_URL:https://payment-api.khipu.com}
farmaexpress.pagos.khipu.api-key=${KHIPU_API_KEY:}

# --- Circuit breaker (uno por proveedor) ---
# De las últimas 5 llamadas, con al menos 3 hechas, si falla el 50% se abre por 30 segundos.
farmaexpress.pagos.circuito.ventana=5
farmaexpress.pagos.circuito.minimo-llamadas=3
farmaexpress.pagos.circuito.porcentaje-fallas=50
farmaexpress.pagos.circuito.espera-abierto=${CIRCUITO_ESPERA_ABIERTO:30s}

# --- RabbitMQ: publica pago.aprobado y pago.rechazado ---
# Nodos de RabbitMQ separados por coma (clúster: rabbitmq1:5672,rabbitmq2:5672). Si un nodo cae,
# la conexión se rehace con el otro. Sin RABBITMQ_ADDRESSES se usa RABBITMQ_HOST:RABBITMQ_PORT.
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:${RABBITMQ_HOST:localhost}:${RABBITMQ_PORT:5672}}
spring.rabbitmq.username=${RABBITMQ_USER:farmaexpress}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:farmaexpress}
spring.rabbitmq.connection-timeout=3s
farmaexpress.eventos.habilitado=${EVENTOS_HABILITADOS:true}
management.health.rabbit.enabled=false

# --- Seguridad: JWT de Microsoft Entra ID (IDaaS) ---
farmaexpress.entra.tenant-id=${AZURE_TENANT_ID:}
farmaexpress.entra.api-client-id=${AZURE_API_CLIENT_ID:}
farmaexpress.entra.issuer=${AZURE_ISSUER:https://login.microsoftonline.com/${farmaexpress.entra.tenant-id}/v2.0,https://sts.windows.net/${farmaexpress.entra.tenant-id}/}
farmaexpress.entra.jwk-set-uri=${AZURE_JWKS_URI:https://login.microsoftonline.com/${farmaexpress.entra.tenant-id}/discovery/v2.0/keys}
farmaexpress.entra.scope=${AZURE_API_SCOPE:access_as_user}

management.endpoints.web.exposure.include=health,info
