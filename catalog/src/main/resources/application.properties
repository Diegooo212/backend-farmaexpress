spring.application.name=farmaexpress-catalog
server.port=${PORT:8081}

# --- MySQL (base propia de este microservicio) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/farmaexpress_catalog?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# El esquema lo crea Flyway (src/main/resources/db/migration); Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Seguridad: JWT de Microsoft Entra External ID (IDaaS) ---
# Tenant y App Registration de la API (los mismos del frontend: VITE_AZURE_TENANT_ID / VITE_AZURE_API_CLIENT_ID).
farmaexpress.entra.tenant-id=${AZURE_TENANT_ID:}
farmaexpress.entra.api-client-id=${AZURE_API_CLIENT_ID:}
# Emisor (iss) y llaves públicas (JWKS) de un tenant External ID. Para un tenant de empresa usa
# AZURE_ISSUER=https://login.microsoftonline.com/<tenant>/v2.0 y AZURE_JWKS_URI=https://login.microsoftonline.com/<tenant>/discovery/v2.0/keys
farmaexpress.entra.issuer=${AZURE_ISSUER:https://${farmaexpress.entra.tenant-id}.ciamlogin.com/${farmaexpress.entra.tenant-id}/v2.0}
farmaexpress.entra.jwk-set-uri=${AZURE_JWKS_URI:https://${farmaexpress.entra.tenant-id}.ciamlogin.com/${farmaexpress.entra.tenant-id}/discovery/v2.0/keys}
# Scope que el frontend pide para la API (api://<client-id>/access_as_user).
farmaexpress.entra.scope=${AZURE_API_SCOPE:access_as_user}

management.endpoints.web.exposure.include=health,info
