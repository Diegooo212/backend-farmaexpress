# Clúster de RabbitMQ de FarmaExpress (2 nodos). Lo comparten rabbitmq1 y rabbitmq2.
#
# Al arrancar, cada nodo busca a los de esta lista y se une a ellos formando un solo clúster:
# las colas, exchanges, bindings y usuarios se ven desde cualquiera de los dos nodos.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq2

# Si un nodo queda aislado de la red, se pausa hasta volver a ver al otro (evita "cerebro dividido").
cluster_partition_handling = autoheal

# Consola web y API de administración (las usa el microservicio rabbit-admin para listar).
management.tcp.port = 15672
