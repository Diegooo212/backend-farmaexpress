spring.application.name=farmaexpress-rabbit-admin
server.port=${PORT:8086}

# --- RabbitMQ: el clúster que se administra ---
# RABBITMQ_ADDRESSES admite varios nodos separados por coma (rabbitmq1:5672,rabbitmq2:5672): si un nodo cae,
# la conexión se hace con el otro. Sin ella se usa RABBITMQ_HOST:RABBITMQ_PORT.
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:${RABBITMQ_HOST:localhost}:${RABBITMQ_PORT:5672}}
spring.rabbitmq.username=${RABBITMQ_USER:farmaexpress}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:farmaexpress}
spring.rabbitmq.connection-timeout=3s

# --- Administración ---
# API HTTP de administración de RabbitMQ (plugin management, puerto 15672): se usa para LISTAR colas,
# exchanges y bindings (el protocolo AMQP solo permite crear y eliminar).
farmaexpress.rabbit.management-url=${RABBITMQ_MANAGEMENT_URL:http://localhost:15672}
farmaexpress.rabbit.vhost=${RABBITMQ_VHOST:/}
# Exchange de mensajes fallidos al que se conectan las DLQ de las colas creadas desde esta API.
farmaexpress.rabbit.dlx=${RABBITMQ_DLX:farmaexpress.eventos.dlx}
# Recursos del sistema: no se pueden eliminar ni modificar desde la API (se comparan por prefijo).
farmaexpress.rabbit.protegidos=farmaexpress.eventos,bff.,catalog.,inventory.,notifications.,payments.,prescriptions.,amq.

# --- Seguridad: JWT de Microsoft Entra ID (IDaaS) ---
farmaexpress.entra.tenant-id=${AZURE_TENANT_ID:}
farmaexpress.entra.api-client-id=${AZURE_API_CLIENT_ID:}
farmaexpress.entra.issuer=${AZURE_ISSUER:https://login.microsoftonline.com/${farmaexpress.entra.tenant-id}/v2.0,https://sts.windows.net/${farmaexpress.entra.tenant-id}/}
farmaexpress.entra.jwk-set-uri=${AZURE_JWKS_URI:https://login.microsoftonline.com/${farmaexpress.entra.tenant-id}/discovery/v2.0/keys}
farmaexpress.entra.scope=${AZURE_API_SCOPE:access_as_user}

management.endpoints.web.exposure.include=health,info
