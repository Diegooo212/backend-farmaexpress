spring.application.name=farmaexpress-analytics
server.port=${PORT:8088}

# --- MySQL (base propia de este microservicio) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/farmaexpress_analytics?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# El esquema lo crea Flyway (src/main/resources/db/migration); Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Kafka: consumidor de los tópicos farmaexpress.ventas y farmaexpress.stock ---
# Basta con que responda un broker: el cliente descubre el resto del clúster.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.client-id=farmaexpress-analytics
# Sin offset guardado (grupo nuevo), el grupo empieza desde lo más antiguo que conserva el tópico.
spring.kafka.consumer.auto-offset-reset=earliest
# El offset lo confirma Spring después de procesar cada mensaje (ack-mode=record), nunca antes.
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer envuelve al deserializador JSON: un mensaje ilegible no detiene al consumidor,
# llega al manejador de errores (que lo manda al DLT) y la partición sigue avanzando.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
# El tipo lo define cada @KafkaListener; no se confía en los headers de tipo que pone el productor.
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=cl.farmaexpress.analytics.eventos
# Solo se leen mensajes confirmados (si un productor usa transacciones, nunca se ve una a medias).
spring.kafka.consumer.isolation-level=read-committed
spring.kafka.consumer.max-poll-records=100
# Rebalanceo cooperativo: al entrar o salir un consumidor, solo se mueven las particiones necesarias.
spring.kafka.consumer.properties.partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor
# Si un consumidor deja de enviar heartbeats por 15 s, Kafka reasigna sus particiones a los demás.
spring.kafka.consumer.properties.session.timeout.ms=15000
spring.kafka.consumer.heartbeat-interval=3s
# Si los tópicos aún no existen, el servicio arranca igual y los espera.
spring.kafka.listener.missing-topics-fatal=false
# KAFKA_HABILITADO=false: el servicio arranca sin consumir (por ejemplo, en un entorno sin Kafka).
spring.kafka.listener.auto-startup=${KAFKA_HABILITADO:true}

# --- Analítica ---
# Hilos consumidores por grupo: uno por cada partición de los tópicos (3).
farmaexpress.analytics.consumidores=3
# "Hoy" se calcula con la hora de Chile.
farmaexpress.analytics.zona=America/Santiago
# Unidades totales a partir de las cuales un producto aparece en "stock bajo".
farmaexpress.analytics.umbral-stock-bajo=${UMBRAL_STOCK_BAJO:10}

# --- Seguridad: JWT de Microsoft Entra ID (IDaaS) ---
farmaexpress.entra.tenant-id=${AZURE_TENANT_ID:}
farmaexpress.entra.api-client-id=${AZURE_API_CLIENT_ID:}
farmaexpress.entra.issuer=${AZURE_ISSUER:https://login.microsoftonline.com/${farmaexpress.entra.tenant-id}/v2.0,https://sts.windows.net/${farmaexpress.entra.tenant-id}/}
farmaexpress.entra.jwk-set-uri=${AZURE_JWKS_URI:https://login.microsoftonline.com/${farmaexpress.entra.tenant-id}/discovery/v2.0/keys}
farmaexpress.entra.scope=${AZURE_API_SCOPE:access_as_user}

management.endpoints.web.exposure.include=health,info
