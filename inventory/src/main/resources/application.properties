spring.application.name=farmaexpress-inventory
server.port=${PORT:8085}

# --- MySQL (base propia de este microservicio) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/farmaexpress_inventory?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# El esquema lo crea Flyway (src/main/resources/db/migration); Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Reglas del inventario ---
# Minutos que el stock queda apartado mientras el cliente paga.
farmaexpress.inventario.minutos-reserva=${MINUTOS_RESERVA:15}
# Un lote "por vencer" es el que vence dentro de estos días (alerta para el personal).
farmaexpress.inventario.dias-alerta-vencimiento=${DIAS_ALERTA_VENCIMIENTO:30}
# Fecha "de hoy" para saber si un lote venció: la de las farmacias.
farmaexpress.zona-horaria=America/Santiago

# --- RabbitMQ: recibe pago.aprobado; publica inventario.stock-cambiado y reserva.expirada ---
# Nodos de RabbitMQ separados por coma (clúster: rabbitmq1:5672,rabbitmq2:5672). Si un nodo cae,
# la conexión se rehace con el otro. Sin RABBITMQ_ADDRESSES se usa RABBITMQ_HOST:RABBITMQ_PORT.
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:${RABBITMQ_HOST:localhost}:${RABBITMQ_PORT:5672}}
spring.rabbitmq.username=${RABBITMQ_USER:farmaexpress}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:farmaexpress}
spring.rabbitmq.connection-timeout=3s
# ACK manual: cada consumidor confirma (basicAck) o rechaza (basicNack) el mensaje de forma explícita
# (ver eventos/ConfirmacionMensajes). Los rechazados sin reencolar van a la DLQ de su cola.
spring.rabbitmq.listener.simple.acknowledge-mode=manual
# Mensajes que RabbitMQ entrega a la vez a cada consumidor antes de recibir su ACK.
spring.rabbitmq.listener.simple.prefetch=10
farmaexpress.eventos.habilitado=${EVENTOS_HABILITADOS:true}
management.health.rabbit.enabled=false

# --- Seguridad: JWT de Microsoft Entra ID (IDaaS) ---
farmaexpress.entra.tenant-id=${AZURE_TENANT_ID:}
farmaexpress.entra.api-client-id=${AZURE_API_CLIENT_ID:}
farmaexpress.entra.issuer=${AZURE_ISSUER:https://login.microsoftonline.com/${farmaexpress.entra.tenant-id}/v2.0,https://sts.windows.net/${farmaexpress.entra.tenant-id}/}
farmaexpress.entra.jwk-set-uri=${AZURE_JWKS_URI:https://login.microsoftonline.com/${farmaexpress.entra.tenant-id}/discovery/v2.0/keys}
farmaexpress.entra.scope=${AZURE_API_SCOPE:access_as_user}

management.endpoints.web.exposure.include=health,info

# --- Kafka (productor): inventory publica el stock de cada producto en farmaexpress.stock (compactado) ---
# Basta con que responda un broker: el cliente descubre el resto del clúster.
# Desde el PC: localhost:9092,localhost:9093,localhost:9094. Entre contenedores: kafka1:29092,...
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.client-id=${spring.application.name}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# Los eventos viajan como JSON (DTO tipados). Sin header de tipo: cada consumidor decide su propia clase.
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
# acks=all: el broker confirma cuando todas las réplicas sincronizadas (al menos min.insync.replicas=2)
# tienen el mensaje. Con idempotencia, los reintentos nunca duplican un mensaje ni cambian su orden.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
# Reintentos automáticos durante 30 s como máximo ante fallas transitorias (cambio de líder, red).
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.producer.properties.request.timeout.ms=10000
# Sin brokers, el envío falla en 5 s en vez de bloquear el hilo 60 s.
spring.kafka.producer.properties.max.block.ms=5000
# Agrupa los mensajes de hasta 10 ms en lotes comprimidos con LZ4 (menos red y disco).
spring.kafka.producer.properties.linger.ms=10
spring.kafka.producer.batch-size=32KB
spring.kafka.producer.compression-type=lz4
# Declara los tópicos (NewTopic) al arrancar si no existen; si Kafka no responde, el servicio arranca igual.
spring.kafka.admin.auto-create=${KAFKA_HABILITADO:true}
spring.kafka.admin.properties.request.timeout.ms=5000
spring.kafka.admin.operation-timeout=10s
spring.kafka.admin.close-timeout=5s
# KAFKA_HABILITADO=false: no publica (por ejemplo, en un servidor sin Kafka).
farmaexpress.kafka.habilitado=${KAFKA_HABILITADO:true}
# 3 réplicas en el clúster de 3 brokers. KAFKA_REPLICAS=1 con un solo broker de desarrollo.
farmaexpress.kafka.replicas=${KAFKA_REPLICAS:3}
