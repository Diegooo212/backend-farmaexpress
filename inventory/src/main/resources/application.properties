spring.application.name=farmaexpress-inventory
server.port=${PORT:8085}

# --- MySQL (base propia de este microservicio) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/farmaexpress_inventory?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# El esquema lo crea Flyway (src/main/resources/db/migration); Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Reglas del inventario ---
# Minutos que el stock queda apartado mientras el cliente paga.
farmaexpress.inventario.minutos-reserva=${MINUTOS_RESERVA:15}
# Un lote "por vencer" es el que vence dentro de estos días (alerta para el personal).
farmaexpress.inventario.dias-alerta-vencimiento=${DIAS_ALERTA_VENCIMIENTO:30}
# Fecha "de hoy" para saber si un lote venció: la de las farmacias.
farmaexpress.zona-horaria=America/Santiago

# --- RabbitMQ: recibe pago.aprobado; publica inventario.stock-cambiado y reserva.expirada ---
# Nodos de RabbitMQ separados por coma (clúster: rabbitmq1:5672,rabbitmq2:5672). Si un nodo cae,
# la conexión se rehace con el otro. Sin RABBITMQ_ADDRESSES se usa RABBITMQ_HOST:RABBITMQ_PORT.
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:${RABBITMQ_HOST:localhost}:${RABBITMQ_PORT:5672}}
spring.rabbitmq.username=${RABBITMQ_USER:farmaexpress}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:farmaexpress}
spring.rabbitmq.connection-timeout=3s
# ACK manual: cada consumidor confirma (basicAck) o rechaza (basicNack) el mensaje de forma explícita
# (ver eventos/ConfirmacionMensajes). Los rechazados sin reencolar van a la DLQ de su cola.
spring.rabbitmq.listener.simple.acknowledge-mode=manual
# Mensajes que RabbitMQ entrega a la vez a cada consumidor antes de recibir su ACK.
spring.rabbitmq.listener.simple.prefetch=10
farmaexpress.eventos.habilitado=${EVENTOS_HABILITADOS:true}
management.health.rabbit.enabled=false

# --- Seguridad: JWT de Microsoft Entra ID (IDaaS) ---
farmaexpress.entra.tenant-id=${AZURE_TENANT_ID:}
farmaexpress.entra.api-client-id=${AZURE_API_CLIENT_ID:}
farmaexpress.entra.issuer=${AZURE_ISSUER:https://login.microsoftonline.com/${farmaexpress.entra.tenant-id}/v2.0,https://sts.windows.net/${farmaexpress.entra.tenant-id}/}
farmaexpress.entra.jwk-set-uri=${AZURE_JWKS_URI:https://login.microsoftonline.com/${farmaexpress.entra.tenant-id}/discovery/v2.0/keys}
farmaexpress.entra.scope=${AZURE_API_SCOPE:access_as_user}

management.endpoints.web.exposure.include=health,info
