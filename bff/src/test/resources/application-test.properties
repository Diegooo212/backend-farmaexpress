# Tenant y App Registration ficticios para las pruebas (los tokens se firman con una llave de prueba).
farmaexpress.entra.tenant-id=11111111-2222-3333-4444-555555555555
farmaexpress.entra.api-client-id=aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
# Sin RabbitMQ en las pruebas: los eventos se entregan llamando directo al listener.
spring.rabbitmq.listener.simple.auto-startup=false
farmaexpress.eventos.habilitado=false
# Sin Kafka en las pruebas: no se crean tópicos ni se publica (el publicador se prueba aparte).
spring.kafka.admin.auto-create=false
farmaexpress.kafka.habilitado=false
