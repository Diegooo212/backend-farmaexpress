spring.application.name=farmaexpress-bff
server.port=${PORT:8080}

# --- MySQL (base propia del BFF: usuarios, carritos y pedidos) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/farmaexpress_bff?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# El esquema lo crea Flyway (src/main/resources/db/migration); Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Seguridad: JWT de Microsoft Entra ID (IDaaS) ---
# El BFF no emite tokens: valida el access token de Entra (igual que API Gateway) y lo reenvía
# a catalog y prescriptions, que también lo validan.
# Tenant y App Registration de la API (los mismos del frontend: VITE_AZURE_TENANT_ID / VITE_AZURE_API_CLIENT_ID).
farmaexpress.entra.tenant-id=${AZURE_TENANT_ID:}
farmaexpress.entra.api-client-id=${AZURE_API_CLIENT_ID:}
# Emisores (iss) aceptados, separados por coma: tokens v2 y v1 de Entra ID (tenant de fuerza de trabajo).
# Para un tenant External ID usa AZURE_ISSUER=https://<tenant>.ciamlogin.com/<tenant>/v2.0
# y AZURE_JWKS_URI=https://<tenant>.ciamlogin.com/<tenant>/discovery/v2.0/keys
farmaexpress.entra.issuer=${AZURE_ISSUER:https://login.microsoftonline.com/${farmaexpress.entra.tenant-id}/v2.0,https://sts.windows.net/${farmaexpress.entra.tenant-id}/}
# Llaves públicas del tenant para verificar la firma del JWT.
farmaexpress.entra.jwk-set-uri=${AZURE_JWKS_URI:https://login.microsoftonline.com/${farmaexpress.entra.tenant-id}/discovery/v2.0/keys}
# Scope que el frontend pide para la API (api://<client-id>/access_as_user).
farmaexpress.entra.scope=${AZURE_API_SCOPE:access_as_user}

# Orígenes del frontend que pueden llamar directo al BFF (desarrollo local).
# En la nube el CORS lo resuelve API Gateway.
farmaexpress.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173}

# --- Microservicios ---
farmaexpress.services.catalog-url=${CATALOG_URL:http://localhost:8081}
farmaexpress.services.prescriptions-url=${PRESCRIPTIONS_URL:http://localhost:8082}

# Las recetas pasan por el BFF antes de llegar a prescriptions.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

management.endpoints.web.exposure.include=health,info
